
name: Render Remotion Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render MP4
        run: |
          mkdir -p out
          npx remotion render src/index.jsx MainVideo out/video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/video.mp4
